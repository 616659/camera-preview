<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Crucial tag for responsive mobile viewport sizing -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Posture Monitor Setup</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #f1f1f1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      text-align: center;
      color: #ffffff;
    }

    .canvas-container {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 320px;
      background: #1e1e1e;
      border: 3px solid #333333;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Keep Crisp 64x64 Pixelation when scaled up */
    canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }

    .controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-blue {
      background-color: #2563eb;
      color: #ffffff;
    }

    .btn-blue:hover {
      background-color: #1d4ed8;
    }

    .btn-green {
      background-color: #16a34a;
      color: #ffffff;
    }

    .btn-green:hover {
      background-color: #15803d;
    }

    .btn:disabled {
      background-color: #27272a;
      color: #71717a;
      cursor: not-allowed;
      transform: none;
    }

    #status {
      font-size: 0.9rem;
      color: #a1a1aa;
      text-align: center;
      line-height: 1.4;
      padding: 0 10px;
    }

    #status.ok {
      color: #4ade80;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📷 Camera Framing Preview</h1>

    <div class="canvas-container">
      <canvas id="canvas" width="64" height="64"></canvas>
    </div>

    <div class="controls">
      <button id="connectBtn" class="btn btn-blue">Connect Bluetooth Camera</button>
      <button id="startInferenceBtn" class="btn btn-green" disabled>Start Inference Mode</button>
    </div>

    <p id="status">Status: Disconnected</p>
  </div>

  <script>
    const SERVICE_UUID      = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const FRAME_STREAM_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";
    const COMMAND_CHAR_UUID = "19b10002-e8f2-537e-4f6c-d104768a1214";

    const CMD_START_INFERENCE = 0x01;  // phone -> board
    const ACK_SWITCHING       = 0x02;  // board -> phone

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const imgData = ctx.createImageData(64, 64);
    const statusEl = document.getElementById('status');
    const connectBtn = document.getElementById('connectBtn');
    const startBtn = document.getElementById('startInferenceBtn');

    let commandChar = null;
    let frameBuffer = new Uint8Array(4096);
    let bufferOffset = 0;
    let ackReceived = false;

    function setStatus(text, ok = false) {
      statusEl.innerText = text;
      statusEl.classList.toggle('ok', ok);
    }

    connectBtn.addEventListener('click', async () => {
      try {
        ackReceived = false;
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'PostureCam-Setup' }],
          optionalServices: [SERVICE_UUID]
        });

        device.addEventListener('gattserverdisconnected', onDisconnected);

        setStatus("Status: Connecting to PostureCam...");
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        // Command channel: used to send the start command and to receive the board's confirmation
        commandChar = await service.getCharacteristic(COMMAND_CHAR_UUID);
        await commandChar.startNotifications();
        commandChar.addEventListener('characteristicvaluechanged', handleCommandNotify);

        // Frame stream
        const streamChar = await service.getCharacteristic(FRAME_STREAM_UUID);
        await streamChar.startNotifications();
        streamChar.addEventListener('characteristicvaluechanged', handleFrameChunk);

        setStatus("Status: Connected! Streaming live preview...");
        startBtn.disabled = false;
        connectBtn.style.display = 'none';

      } catch (err) {
        console.error(err);
        setStatus("Connection Failed: " + err);
      }
    });

    startBtn.addEventListener('click', async () => {
      if (!commandChar) return;

      try {
        startBtn.disabled = true;
        await commandChar.writeValue(new Uint8Array([CMD_START_INFERENCE]));
        // The board can take a couple of seconds to react (it finishes the current frame first)
        setStatus("📨 Command sent. Waiting for the board to confirm...");
      } catch (err) {
        console.error("Failed to send command:", err);
        setStatus("Failed to send command: " + err);
        startBtn.disabled = false;
      }
    });

    function handleCommandNotify(event) {
      const value = event.target.value.getUint8(0);
      if (value === ACK_SWITCHING) {
        ackReceived = true;
        setStatus("✅ Confirmed: the board is switching to inference mode. The preview stops now; reset the board to return to setup.", true);
        startBtn.disabled = true;
      }
    }

    function onDisconnected() {
      if (ackReceived) {
        // Expected: the board shuts BLE down when entering inference mode
        setStatus("✅ Inference mode running on the board. Bluetooth closed as expected.", true);
      } else {
        setStatus("Status: Disconnected (signal dropped, or the board was reset).");
        startBtn.disabled = true;
        connectBtn.style.display = '';
      }
    }

    function handleFrameChunk(event) {
      const chunk = new Uint8Array(event.target.value.buffer);

      // Check header marker [0xFF, 0xD8, 0xFF, 0x00]
      if (chunk.length === 4 && chunk[0] === 0xFF && chunk[1] === 0xD8) {
        bufferOffset = 0;
        return;
      }

      // Check end marker [0xFF, 0xD9, 0xFF, 0x00]; only draw complete frames
      if (chunk.length === 4 && chunk[0] === 0xFF && chunk[1] === 0xD9) {
        if (bufferOffset >= 4096) renderFrame(frameBuffer);
        return;
      }

      // Collect payload bytes
      if (bufferOffset + chunk.length <= 4096) {
        frameBuffer.set(chunk, bufferOffset);
        bufferOffset += chunk.length;
      }
    }

    function renderFrame(buffer) {
      for (let i = 0; i < 4096; i++) {
        let rawVal = buffer[i];

        // Convert int8 (-128..127) to uint8 (0..255)
        if (rawVal > 127) rawVal -= 256;
        const gray = Math.min(255, Math.max(0, rawVal + 128));

        const pixelIdx = i * 4;
        imgData.data[pixelIdx + 0] = gray;
        imgData.data[pixelIdx + 1] = gray;
        imgData.data[pixelIdx + 2] = gray;
        imgData.data[pixelIdx + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
    }
  </script>
</body>
</html>
