<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PostureCam Framing Viewer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 15px;
      color: #ffffff;
    }

    .canvas-container {
      border: 3px solid #333;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      background-color: #000;
      margin-bottom: 20px;
    }

    canvas {
      display: block;
      width: 256px;
      height: 256px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .btn {
      background-color: #007bff;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:disabled {
      background-color: #444;
      cursor: not-allowed;
    }

    .btn:hover:not(:disabled) {
      background-color: #0056b3;
    }

    #status {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #aaa;
      text-align: center;
      max-width: 300px;
    }
  </style>
</head>
<body>

  <h1>📷 Camera Framing Preview</h1>

  <div class="canvas-container">
    <canvas id="viewfinder" width="64" height="64"></canvas>
  </div>

  <button id="connectBtn" class="btn">Connect Bluetooth Camera</button>
  <div id="status">Status: Disconnected</div>

  <script>
    const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const CHAR_UUID    = "19b10001-e8f2-537e-4f6c-d104768a1214";

    const connectBtn = document.getElementById('connectBtn');
    const statusDiv  = document.getElementById('status');
    const canvas     = document.getElementById('viewfinder');
    const ctx        = canvas.getContext('2d');

    const imgData = ctx.createImageData(64, 64);
    let rxBuffer  = new Uint8Array(4096);
    let rxPointer = 0;
    let receiving = false;

    connectBtn.addEventListener('click', async () => {
      try {
        statusDiv.innerText = "Status: Searching for device...";
        
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'PostureCam-Setup' }],
          optionalServices: [SERVICE_UUID]
        });

        device.addEventListener('gattserverdisconnected', onDisconnected);

        statusDiv.innerText = "Status: Connecting GATT server...";
        const server = await device.gatt.connect();

        // Small delay to stabilize connection post-GATT handshake
        await new Promise(r => setTimeout(r, 300));

        statusDiv.innerText = "Status: Fetching camera service...";
        const service = await server.getPrimaryService(SERVICE_UUID);

        statusDiv.innerText = "Status: Subscribing to image stream...";
        const characteristic = await service.getCharacteristic(CHAR_UUID);

        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', handleIncomingPacket);

        statusDiv.innerText = "Status: Connected! Streaming live frame...";
        connectBtn.disabled = true;

      } catch (err) {
        console.error(err);
        statusDiv.innerText = "Error: " + err.message;
        connectBtn.disabled = false;
      }
    });

    function onDisconnected(event) {
      statusDiv.innerText = "Status: Disconnected (Mode changed or signal dropped)";
      connectBtn.disabled = false;
    }

    function handleIncomingPacket(event) {
      const data = new Uint8Array(event.target.value.buffer);

      // Start Marker
      if (data.length === 4 && data[0] === 0xFF && data[1] === 0xD8 && data[2] === 0xFF && data[3] === 0x00) {
        rxPointer = 0;
        receiving = true;
        return;
      }

      // End Marker
      if (data.length === 4 && data[0] === 0xFF && data[1] === 0xD9 && data[2] === 0xFF && data[3] === 0x00) {
        if (receiving && rxPointer >= 4096) {
          renderFrame(rxBuffer);
        }
        receiving = false;
        return;
      }

      // Read chunk
      if (receiving) {
        if (rxPointer + data.length <= rxBuffer.length) {
          rxBuffer.set(data, rxPointer);
          rxPointer += data.length;
        }
      }
    }

    function renderFrame(buffer) {
      for (let i = 0; i < 4096; i++) {
        const val = buffer[i];
        const pixelIdx = i * 4;

        imgData.data[pixelIdx + 0] = val; // R
        imgData.data[pixelIdx + 1] = val; // G
        imgData.data[pixelIdx + 2] = val; // B
        imgData.data[pixelIdx + 3] = 255; // A
      }
      ctx.putImageData(imgData, 0, 0);
    }
  </script>
</body>
</html>
