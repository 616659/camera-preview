<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Posture Monitor</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
    #canvas { border: 2px solid #444; margin-top: 10px; image-rendering: pixelated; }
    .btn { padding: 12px 24px; font-size: 16px; margin: 10px; cursor: pointer; border: none; border-radius: 6px; }
    .btn-blue { background: #007bff; color: white; }
    .btn-green { background: #28a745; color: white; }
    .btn:disabled { background: #555; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>📷 Camera Framing Preview</h1>
  
  <canvas id="canvas" width="64" height="64" style="width: 256px; height: 256px;"></canvas>
  
  <div>
    <button id="connectBtn" class="btn btn-blue">Connect Bluetooth Camera</button>
    <button id="startInferenceBtn" class="btn btn-green" disabled>Start Inference Mode</button>
  </div>
  
  <p id="status">Status: Disconnected</p>

  <script>
    const SERVICE_UUID        = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const FRAME_STREAM_UUID   = "19b10001-e8f2-537e-4f6c-d104768a1214";
    const COMMAND_CHAR_UUID   = "19b10002-e8f2-537e-4f6c-d104768a1214";

    let commandChar = null;

    document.getElementById('connectBtn').addEventListener('click', async () => {
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'PostureCam' }],
          optionalServices: [SERVICE_UUID]
        });

        document.getElementById('status').innerText = "Status: Connecting...";
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        // Get Command Characteristic
        commandChar = await service.getCharacteristic(COMMAND_CHAR_UUID);

        // Get Preview Stream Characteristic
        const streamChar = await service.getCharacteristic(FRAME_STREAM_UUID);
        await streamChar.startNotifications();
        streamChar.addEventListener('characteristicvaluechanged', handleFrameData);

        document.getElementById('status').innerText = "Status: Connected! Streaming live preview...";
        document.getElementById('startInferenceBtn').disabled = false;

      } catch (err) {
        console.error(err);
        document.getElementById('status').innerText = "Connection Failed: " + err;
      }
    });

    document.getElementById('startInferenceBtn').addEventListener('click', async () => {
      if (!commandChar) return;

      try {
        // Send byte 0x01 to trigger INFERENCE mode on the Arduino
        const cmd = new Uint8Array([0x01]);
        await commandChar.writeValue(cmd);

        document.getElementById('status').innerText = "Status: Mode Changed! Arduino running TFLite Inference locally.";
        document.getElementById('startInferenceBtn').disabled = true;
      } catch (err) {
        console.error("Failed to send mode command:", err);
      }
    });

    function handleFrameData(event) {
      // Your existing canvas frame rendering logic here
    }
  </script>
</body>
</html>
